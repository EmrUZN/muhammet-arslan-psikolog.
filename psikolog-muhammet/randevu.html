  <section class="appointment">
    <div class="container">
      <h2>Randevu Talebi</h2>
      <p>
        Psikolojik danışmanlık randevunuzu oluşturmak için aşağıdaki formu doldurun. Size en kısa sürede geri dönüş yapacağız.
      </p>

      <form action="mailto:muhammet@example.com" method="post" enctype="text/plain">
        <div class="form-group">
          <label for="name">Adınız:</label>
          <input type="text" id="name" name="name" required />
        </div>
        
        <div class="form-group">
          <label for="email">E-posta Adresiniz:</label>
          <input type="email" id="email" name="email" required />
        </div>
        
        <div class="form-group">
          <label for="message">Mesajınız:</label>
          <textarea id="message" name="message" rows="4" required></textarea>
        </div>

        <div class="form-group">
          <label for="appointment-date">Randevu Tarihi:</label>
          <input type="date" id="appointment-date" name="appointment-date" required />
        </div>

        <button type="submit" class="submit-btn">Randevu Talep Et</button>
      </form>
    </div>
  </section>
